<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">LikhArtisan system architecture</title>
  <desc id="desc">Users access the React web application in a browser. The app contains the Three.js viewer and core features. It connects to the Express API, Supabase, and Google Maps. The Express API connects to Supabase, Groq, PayMongo, Lalamove, and Cloudflare R2. Development tools are shown separately.</desc>
  <defs>
    <style>
      .bg { fill:#f8f5f0; }
      .card { fill:#fff; stroke:#e1d8cf; stroke-width:2; }
      .subcard { fill:#faf6f2; stroke:#eadfd6; stroke-width:1.5; }
      .title { font:700 46px 'Segoe UI',Arial,sans-serif; fill:#302923; letter-spacing:-1px; }
      .subtitle { font:400 20px 'Segoe UI',Arial,sans-serif; fill:#75695f; }
      .eyebrow { font:700 15px 'Segoe UI',Arial,sans-serif; fill:#a65325; letter-spacing:2px; }
      .cardtitle { font:700 28px 'Segoe UI',Arial,sans-serif; fill:#302923; }
      .body { font:500 20px 'Segoe UI',Arial,sans-serif; fill:#4b4038; }
      .small { font:500 17px 'Segoe UI',Arial,sans-serif; fill:#71665c; }
      .tiny { font:600 15px 'Segoe UI',Arial,sans-serif; fill:#75695f; }
      .pilltext { font:600 17px 'Segoe UI',Arial,sans-serif; fill:#814320; }
      .feature { font:600 18px 'Segoe UI',Arial,sans-serif; fill:#453b34; }
      .flow { fill:none; stroke:#9b542e; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .bidirectional { fill:none; stroke:#9b542e; stroke-width:3.5; stroke-linecap:round; marker-start:url(#arrow); marker-end:url(#arrow); }
      .divider { stroke:#e8ded5; stroke-width:2; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#9b542e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#493827" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <rect x="0" y="0" width="1600" height="13" fill="#9b542e"/>
  <text class="eyebrow" x="70" y="65">DEFENSE PRESENTATION</text>
  <text class="title" x="70" y="121">LikhArtisan System Architecture</text>
  <text class="subtitle" x="72" y="151">Browser application, server services, data, and third-party integrations</text>

  <!-- Runtime connections sit behind the cards. -->
  <path class="flow" d="M294 325 H336"/>
  <path class="bidirectional" d="M830 325 H903"/>
  <path class="bidirectional" d="M1210 325 H1263"/>
  <path class="bidirectional" d="M476 624 V682"/>
  <path class="bidirectional" d="M748 624 V682"/>
  <path class="bidirectional" d="M1054 495 V682"/>

  <!-- People and devices. -->
  <rect class="card" x="70" y="195" width="224" height="260" rx="22" filter="url(#shadow)"/>
  <circle cx="118" cy="249" r="23" fill="#ecd2bf"/>
  <circle cx="176" cy="249" r="23" fill="#d7bb9c"/>
  <circle cx="234" cy="249" r="23" fill="#b78360"/>
  <path d="M86 296 Q118 267 150 296 M144 296 Q176 267 208 296 M202 296 Q234 267 266 296" fill="none" stroke="#9b542e" stroke-width="6" stroke-linecap="round"/>
  <text class="cardtitle" x="94" y="352">Users</text>
  <text class="small" x="94" y="383">Customers · Artisans</text>
  <text class="small" x="94" y="409">Admins · Super Admins</text>
  <text class="tiny" x="94" y="435">Desktop, tablet, or phone</text>

  <!-- Browser application. -->
  <rect class="card" x="340" y="180" width="490" height="444" rx="24" filter="url(#shadow)"/>
  <rect x="340" y="180" width="490" height="11" rx="5" fill="#c27442"/>
  <text class="eyebrow" x="372" y="222">FRONT END · VERCEL</text>
  <text class="cardtitle" x="372" y="263">Browser application</text>
  <text class="small" x="372" y="296">React · TypeScript · Vite · Tailwind CSS · HTML5</text>
  <line class="divider" x1="372" y1="319" x2="798" y2="319"/>
  <text class="eyebrow" x="372" y="353">CORE FEATURES</text>
  <text class="feature" x="372" y="388">Gallery &amp; shops</text>
  <text class="feature" x="604" y="388">3D customization</text>
  <text class="feature" x="372" y="424">Cart &amp; checkout</text>
  <text class="feature" x="604" y="424">Orders &amp; wishlist</text>
  <text class="feature" x="372" y="460">Customer–artisan chat</text>
  <text class="feature" x="604" y="460">LikhAI assistant</text>
  <text class="feature" x="372" y="496">Artisan dashboard</text>
  <text class="feature" x="604" y="496">Admin dashboard</text>
  <rect class="subcard" x="372" y="524" width="426" height="72" rx="15"/>
  <text class="eyebrow" x="394" y="552">3D VIEWER IN THE BROWSER</text>
  <text class="body" x="394" y="581">Three.js · React Three Fiber</text>

  <!-- Trusted server. -->
  <rect class="card" x="905" y="195" width="305" height="300" rx="22" filter="url(#shadow)"/>
  <rect x="905" y="195" width="305" height="11" rx="5" fill="#5d7890"/>
  <text class="eyebrow" x="934" y="237">BACK END · RENDER</text>
  <text class="cardtitle" x="934" y="278">Express API</text>
  <text class="small" x="934" y="310">Node.js + Express</text>
  <line class="divider" x1="934" y1="330" x2="1181" y2="330"/>
  <text class="body" x="934" y="365">Payment verification</text>
  <text class="body" x="934" y="396">Delivery quotations</text>
  <text class="body" x="934" y="427">LikhAI requests</text>
  <text class="body" x="934" y="458">File uploads</text>

  <!-- Integrations reached through the API. -->
  <rect class="card" x="1265" y="180" width="270" height="444" rx="24" filter="url(#shadow)"/>
  <rect x="1265" y="180" width="270" height="11" rx="5" fill="#88a076"/>
  <text class="eyebrow" x="1293" y="223">EXTERNAL SERVICES</text>
  <text class="cardtitle" x="1293" y="263">API &amp; storage</text>
  <line class="divider" x1="1293" y1="284" x2="1507" y2="284"/>
  <circle cx="1309" cy="323" r="9" fill="#d6734b"/><text class="body" x="1332" y="330">Groq <tspan class="small">· AI</tspan></text>
  <circle cx="1309" cy="387" r="9" fill="#5e92a4"/><text class="body" x="1332" y="394">PayMongo</text>
  <text class="small" x="1332" y="418">Payments</text>
  <circle cx="1309" cy="471" r="9" fill="#df8b52"/><text class="body" x="1332" y="478">Lalamove</text>
  <text class="small" x="1332" y="502">Delivery</text>
  <circle cx="1309" cy="554" r="9" fill="#ef9c3f"/><text class="body" x="1332" y="561">Cloudflare R2</text>
  <text class="small" x="1332" y="585">Images &amp; 3D files</text>

  <!-- Direct browser services and shared data platform. -->
  <rect class="card" x="340" y="684" width="270" height="142" rx="21" filter="url(#shadow)"/>
  <rect x="340" y="684" width="270" height="10" rx="5" fill="#4285f4"/>
  <text class="eyebrow" x="367" y="728">MAP &amp; ADDRESS</text>
  <text class="cardtitle" x="367" y="769">Google Maps</text>
  <text class="small" x="367" y="797">Browser-side map service</text>

  <rect class="card" x="651" y="684" width="444" height="142" rx="21" filter="url(#shadow)"/>
  <rect x="651" y="684" width="444" height="10" rx="5" fill="#4ca980"/>
  <text class="eyebrow" x="682" y="728">DATA &amp; IDENTITY</text>
  <text class="cardtitle" x="682" y="770">Supabase</text>
  <text class="small" x="682" y="798">Authentication · PostgreSQL database</text>

  <!-- These tools are used to build the system, not part of request flow. -->
  <rect x="70" y="878" width="1465" height="105" rx="20" fill="#efe8e0" stroke="#e3d8ce" stroke-width="1.5"/>
  <text class="eyebrow" x="100" y="916">DEVELOPMENT &amp; TESTING TOOLS</text>
  <text class="body" x="100" y="955">Blender · VS Code · Git/GitHub · Vitest · React Testing Library · Node.js test runner</text>
  <text class="tiny" x="1293" y="1020">ARCHITECTURE OVERVIEW</text>
</svg>
