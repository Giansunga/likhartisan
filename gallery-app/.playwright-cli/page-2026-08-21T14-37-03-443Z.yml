              - generic [ref=f6e452]:
                - paragraph [ref=f6e453]: Why LikhArtisan exists
                - heading "A local craft deserves a clearer path online." [level=2] [ref=f6e454]
                - paragraph [ref=f6e455]: LikhArtisan is an interactive pottery marketplace and design system built around the pottery community of Santo Tomas, Pampanga.
                - paragraph [ref=f6e456]: "The idea is practical: make participating shops easier to find, let customers understand more before purchasing, and give custom ideas a clearer path from screen to maker. Technology is the bridge—not the author of the craft."
                - blockquote [ref=f6e457]: “The digital experience should make the maker more visible, not replace the maker.”
          - region [ref=f6e458]:
            - generic [ref=f6e459]:
              - generic [ref=f6e460]:
                - paragraph [ref=f6e461]: A working local tradition
                - heading "Pottery is part of the working identity of Santo Tomas." [level=2] [ref=f6e462]
                - paragraph [ref=f6e463]: Municipal sources document pottery making as a local industry and identify its artisan communities as a cultural and tourism asset.
                - paragraph [ref=f6e464]: LikhArtisan treats that context with care. The platform does not claim to define the tradition; it creates another way for people to encounter the work, learn who made it, and explore what participating shops offer today.
