name: Keep Server Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: GitHub-Actions-Ping" https://likhartisan.onrender.com/health)
          echo "HTTP status: $response"
          if [ "$response" -ne 200 ]; then
            echo "Ping returned non-200 status, retrying in 30s..."
            sleep 30
            response=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: GitHub-Actions-Ping" https://likhartisan.onrender.com/health)
            echo "Retry HTTP status: $response"
          fi
